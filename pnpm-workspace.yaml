packages:
  - apps/*
  - packages/*

autoInstallPeers: false

# Keep this until the pinned Remix test runner picks up the fixes.
overrides:
  '@remix-run/test>esbuild': 0.28.2

allowBuilds:
  esbuild@0.28.2: true
  workerd@1.20261117.1: true

minimumReleaseAgeExclude:
  - '@remix-run/assets@1.0.3'
  - '@remix-run/async-context-middleware@1.0.1'
  - '@remix-run/auth-middleware@1.0.2'
  - '@remix-run/auth@1.0.2'
  - '@remix-run/cli@1.0.3'
  - '@remix-run/component-hmr@1.0.2'
  - '@remix-run/component@1.3.0'
  - '@remix-run/compression-middleware@1.0.3'
  - '@remix-run/cookie@1.0.3'
  - '@remix-run/cop-middleware@1.0.1'
  - '@remix-run/cors-middleware@1.0.3'
  - '@remix-run/csp-middleware@1.0.1'
  - '@remix-run/csrf-middleware@1.0.2'
  - '@remix-run/data-schema@1.0.1'
  - '@remix-run/data-table-mysql@1.1.0'
  - '@remix-run/data-table-postgres@1.0.1'
  - '@remix-run/data-table-sqlite@1.1.0'
  - '@remix-run/data-table@1.1.0'
  - '@remix-run/fetch-proxy@1.0.3'
  - '@remix-run/fetch-router@1.0.1'
  - '@remix-run/form-data-middleware@1.1.2'
  - '@remix-run/form-data-parser@1.1.2'
  - '@remix-run/headers@1.1.1'
  - '@remix-run/logger-middleware@1.0.1'
